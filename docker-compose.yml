services:
  postgres:
    image: postgres:17
    container_name: azure-quiz-backend-postgres
    environment:
      POSTGRES_DB: quizz
      POSTGRES_USER: quizz
      POSTGRES_PASSWORD: quizz
    ports:
      - "5432:5432"
    volumes:
      - quizz-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quizz -d quizz"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: azure-quiz-backend-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  azurite:
    image: mcr.microsoft.com/azure-storage/azurite
    container_name: azure-quiz-backend-azurite
    command: "azurite-blob --blobHost 0.0.0.0 --blobPort 10000 --skipApiVersionCheck"
    ports:
      - "10000:10000"

volumes:
  quizz-db-data:
