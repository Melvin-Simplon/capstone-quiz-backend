# The entry point. Holds the deployment, which needs the jar the tests ran
# against, and calls one workflow per scanning category.
name: CI/CD

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [main]
  # Triggered by hand, and by the Makefile in the infrastructure repository.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: false

jobs:
  quality:
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    uses: ./.github/workflows/ci-quality.yml

  secrets:
    uses: ./.github/workflows/ci-secrets.yml

  sca:
    # dependency-review posts its findings on the pull request.
    permissions:
      contents: read
      pull-requests: write
    uses: ./.github/workflows/ci-sca.yml

  sast:
    # A called workflow cannot hold more than its caller grants it.
    permissions:
      contents: read
      security-events: write
    uses: ./.github/workflows/ci-sast.yml

  deploy:
    needs: [quality, secrets, sca, sast]
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    # Without this the job inherits the six hour default. The health check below
    # already gives up after five minutes, so anything past thirty is a runner
    # that will not come back, and it holds the ci-cd concurrency group for the
    # ref while it waits.
    timeout-minutes: 30
    environment: nonprod
    outputs:
      url: ${{ steps.health.outputs.url }}
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: backend-jar

      # No client secret: the workflow proves which repository, branch and
      # environment it runs from, and Azure hands back a token that dies with the
      # job.
      - name: Sign in to Azure
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      # Asked for by tag rather than written down here, so that renaming or
      # rebuilding the infrastructure leaves this workflow untouched.
      - name: Find the web app
        id: target
        run: |
          # One query per value: asking for a pair returns a JSON array, which tsv
          # prints one element per line rather than as two columns, so reading it
          # into two variables silently leaves the second one empty.
          filter="[?tags.component=='backend' && tags.project=='simplon-quiz']"
          name=$(az webapp list --query "${filter}.name | [0]" -o tsv)
          group=$(az webapp list --query "${filter}.resourceGroup | [0]" -o tsv)
          state=$(az webapp list --query "${filter}.state | [0]" -o tsv)

          if [ -z "$name" ] || [ -z "$group" ]; then
            echo "No web app tagged component=backend, project=simplon-quiz." >&2
            exit 1
          fi

          # Deploying to a stopped app looks like it works: the jar uploads, then
          # the tracker waits for a site that will never start and the job dies
          # sixteen minutes later on a timeout that names nothing. Terraform does
          # not track this state either, so the plan stays clean while it happens.
          if [ "$state" != "Running" ]; then
            echo "$name is $state. Start it with:" >&2
            echo "  az webapp start -n $name -g $group" >&2
            exit 1
          fi

          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "group=$group" >> "$GITHUB_OUTPUT"
          echo "Deploying to $name in $group"

      - name: Deploy the jar
        run: |
          jar=$(ls ./*.jar | head -1)
          az webapp deploy \
            --resource-group "${{ steps.target.outputs.group }}" \
            --name "${{ steps.target.outputs.name }}" \
            --src-path "$jar" \
            --type jar

      # A deployment that returns success while the application fails to start is
      # the failure this catches. The window is generous because a cold start
      # replays the Flyway migrations.
      - name: Wait for the application to answer
        id: health
        run: |
          url="https://$(az webapp show \
            --resource-group "${{ steps.target.outputs.group }}" \
            --name "${{ steps.target.outputs.name }}" \
            --query defaultHostName -o tsv)"
          echo "url=${url}" >> "$GITHUB_OUTPUT"
          health="${url}/actuator/health"

          for attempt in $(seq 1 30); do
            body=$(curl -fsS --max-time 10 "$health" || true)
            case "$body" in
              *'"status":"UP"'*)
                echo "$health answered UP after ${attempt} attempts"
                exit 0
                ;;
            esac
            sleep 10
          done

          echo "No healthy answer from $health after five minutes." >&2
          az webapp log tail --resource-group "${{ steps.target.outputs.group }}" \
            --name "${{ steps.target.outputs.name }}" --provider application &
          sleep 20
          exit 1

  # The API as it runs, from outside. A backend has no page to render, so what
  # this reads is the response headers and what the error pages give away.
  dast:
    name: OWASP ZAP
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Scan the running API
        uses: zaproxy/action-baseline@de8ad967d3548d44ef623df22cf95c3b0baf8b25 # v0.15.0
        with:
          target: ${{ needs.deploy.outputs.url }}
          fail_action: false
          allow_issue_writing: false
          artifact_name: zap-baseline-report

      - name: Put the findings on the summary page
        if: always()
        env:
          TARGET: ${{ needs.deploy.outputs.url }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: scripts/workflows/security/summarise-the-zap-report.sh
