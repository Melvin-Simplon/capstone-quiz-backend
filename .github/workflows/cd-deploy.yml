# Ships what lands on main: the jar the tests ran against, then a DAST scan of
# the API it now serves.
#
# The build and security checks already gated the merge on the pull request.
# main runs the build again because the deployment needs its jar, and CodeQL to
# keep the reference the next pull requests are compared against.
#
# A dispatch, which is how the Makefile in the infrastructure repository gets
# here, still builds the jar but skips CodeQL: it asks for a deployment of what
# main already holds.
name: CD - Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    # secrets: inherit would hand the called workflow every secret this
    # repository holds. It needs one.
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    uses: ./.github/workflows/ci-build.yml

  security:
    if: github.event_name == 'push'
    # A called workflow cannot hold more than its caller grants. CodeQL writes
    # to the Security tab; pull-requests is declared by dependency-review, which
    # does not run here but is checked against this grant all the same.
    permissions:
      contents: read
      security-events: write
      pull-requests: write
    uses: ./.github/workflows/ci-security.yml
    with:
      reference_only: true

  # Whether there is anything to deploy to, asked before the deployment rather
  # than inside it. The environment is built and torn down between sessions, so
  # an absent one is a normal state: there is nothing to deploy, which is not a
  # deployment that failed. Kept in its own job so that answering no leaves
  # deploy skipped rather than red, and so the reviewer below is only ever asked
  # about a deployment that can actually happen.
  #
  # No environment: here on purpose. nonprod carries the approval gate, and the
  # Azure variables are repository level, so this job reads them without it. The
  # federated credential for refs/heads/main covers the sign in.
  #
  # security is skipped on a dispatch, and a skipped need skips this job too
  # unless the condition says otherwise. A failed one still stops it.
  target:
    needs: [build, security]
    if: ${{ !cancelled() && !contains(needs.*.result, 'failure') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      found: ${{ steps.look.outputs.found }}
      name: ${{ steps.look.outputs.name }}
      group: ${{ steps.look.outputs.group }}
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - name: Sign in to Azure
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Find the web app
        id: look
        run: scripts/workflows/deploy/find-the-web-app.sh

  deploy:
    needs: target
    # Skipped, not failed, when the environment is not built. target is skipped
    # on a pull request too, which leaves this output empty and skips this job.
    if: needs.target.outputs.found == 'true'
    runs-on: ubuntu-latest
    # Without this the job inherits the six hour default. The health check below
    # already gives up after five minutes, so anything past thirty is a runner
    # that will not come back, and it holds the ci-cd concurrency group for the
    # ref while it waits.
    timeout-minutes: 30
    environment: nonprod
    outputs:
      url: ${{ steps.health.outputs.url }}
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: backend-jar

      # No client secret: the workflow proves which repository, branch and
      # environment it runs from, and Azure hands back a token that dies with the
      # job.
      - name: Sign in to Azure
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy the jar
        run: |
          jar=$(ls ./*.jar | head -1)
          az webapp deploy \
            --resource-group "${{ needs.target.outputs.group }}" \
            --name "${{ needs.target.outputs.name }}" \
            --src-path "$jar" \
            --type jar

      # A deployment that returns success while the application fails to start is
      # the failure this catches. The window is generous because a cold start
      # replays the Flyway migrations.
      - name: Wait for the application to answer
        id: health
        run: |
          url="https://$(az webapp show \
            --resource-group "${{ needs.target.outputs.group }}" \
            --name "${{ needs.target.outputs.name }}" \
            --query defaultHostName -o tsv)"
          echo "url=${url}" >> "$GITHUB_OUTPUT"
          health="${url}/actuator/health"

          for attempt in $(seq 1 30); do
            body=$(curl -fsS --max-time 10 "$health" || true)
            case "$body" in
              *'"status":"UP"'*)
                echo "$health answered UP after ${attempt} attempts"
                exit 0
                ;;
            esac
            sleep 10
          done

          echo "No healthy answer from $health after five minutes." >&2
          az webapp log tail --resource-group "${{ needs.target.outputs.group }}" \
            --name "${{ needs.target.outputs.name }}" --provider application &
          sleep 20
          exit 1

  # Separate job: a failure here means the deployment is wrong, not the upload.
  dast:
    needs: deploy
    # A called workflow cannot hold more than its caller grants, and GitHub
    # checks every job in it before starting the run, skipped ones included.
    # id-token is for its target job, which only runs on the schedule.
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/cd-dast.yml
    with:
      api_url: ${{ needs.deploy.outputs.url }}
