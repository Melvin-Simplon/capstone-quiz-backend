name: CD - Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    uses: ./.github/workflows/ci-build.yml

  security:
    if: github.event_name == 'push'
    permissions:
      contents: read
      security-events: write
      pull-requests: write
    uses: ./.github/workflows/ci-security.yml
    with:
      reference_only: true

  target:
    needs: [build, security]
    if: ${{ !cancelled() && !contains(needs.*.result, 'failure') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      found: ${{ steps.look.outputs.found }}
      name: ${{ steps.look.outputs.name }}
      group: ${{ steps.look.outputs.group }}
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - name: Sign in to Azure
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Find the web app
        id: look
        run: scripts/workflows/deploy/find-the-web-app.sh

  deploy:
    needs: target
    if: ${{ !cancelled() && needs.target.outputs.found == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: nonprod
    outputs:
      url: ${{ steps.health.outputs.url }}
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: backend-jar

      - name: Sign in to Azure
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy the jar
        run: |
          jar=$(ls ./*.jar | head -1)
          az webapp deploy \
            --resource-group "${{ needs.target.outputs.group }}" \
            --name "${{ needs.target.outputs.name }}" \
            --src-path "$jar" \
            --type jar

      - name: Wait for the application to answer
        id: health
        run: |
          url="https://$(az webapp show \
            --resource-group "${{ needs.target.outputs.group }}" \
            --name "${{ needs.target.outputs.name }}" \
            --query defaultHostName -o tsv)"
          echo "url=${url}" >> "$GITHUB_OUTPUT"
          health="${url}/actuator/health"

          for attempt in $(seq 1 30); do
            body=$(curl -fsS --max-time 10 "$health" || true)
            case "$body" in
              *'"status":"UP"'*)
                echo "$health answered UP after ${attempt} attempts"
                exit 0
                ;;
            esac
            sleep 10
          done

          echo "No healthy answer from $health after five minutes." >&2
          az webapp log tail --resource-group "${{ needs.target.outputs.group }}" \
            --name "${{ needs.target.outputs.name }}" --provider application &
          sleep 20
          exit 1

  dast:
    needs: deploy
    if: ${{ !cancelled() && needs.deploy.result == 'success' }}
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/cd-dast.yml
    with:
      api_url: ${{ needs.deploy.outputs.url }}
