name: CI - Build module

on:
  pull_request:
    branches: [develop, main]
  workflow_call:
    secrets:
      SONAR_TOKEN:
        required: true
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  quality:
    name: Build, tests and quality (Maven, SonarCloud)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Compile and test
        run: ./mvnw -B -ntp verify

      - name: Analyse with SonarCloud
        if: github.actor != 'dependabot[bot]'
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: >
          ./mvnw -B -ntp
          org.sonarsource.scanner.maven:sonar-maven-plugin:5.1.0.4751:sonar

      - name: Put the tests and the coverage on the summary page
        if: always()
        env:
          PULL_REQUEST: ${{ github.event.number }}
        run: scripts/workflows/ci/summarise-the-quality-report.sh

      - name: Keep the jar the tests ran against
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v7
        with:
          name: backend-jar
          path: target/*.jar
          retention-days: 1
          if-no-files-found: error
