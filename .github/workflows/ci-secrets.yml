# Secret scanning, in the diff and in the history.
#
# Called from ci-cd.yml.
name: Secrets

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secrets:
    name: gitleaks and Trivy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # Full history, because the secret scan below reads commits rather than
      # files: something committed and removed the next day is still readable
      # forever in a public repository.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Scan the history for secrets
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          curl -sSfL --proto '=https' --proto-redir '=https' "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz gitleaks
          ./gitleaks git . --no-banner --redact --config .gitleaks.toml

      - name: Scan for secrets
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: secret
          severity: MEDIUM,HIGH,CRITICAL
          exit-code: "1"
