# Software composition analysis: known CVEs in the dependencies.
#
# Called from ci-cd.yml.
name: SCA

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sca:
    name: Trivy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # Trivy reads the dependency manifests from the working tree. Without a
      # checkout it scans an empty runner, finds nothing, and reports success:
      # the check stays green while guarding nothing.
      - uses: actions/checkout@v7

      - name: Scan the dependencies
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: "1"


  # Trivy reads the dependencies that are here. This reads what the pull request
  # adds, which a scan of the current tree cannot tell apart.
  review:
    name: dependency-review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          comment-summary-in-pr: on-failure
