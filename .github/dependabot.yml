version: 2
# Monthly and grouped, so the repository gets two pull requests a month at most.
updates:
  - package-ecosystem: maven
    directory: /
    schedule:
      interval: monthly
      time: '06:00'
      timezone: Europe/Paris
    target-branch: develop
    open-pull-requests-limit: 1
    groups:
      maven:
        patterns:
          - '*'
    # Spring Boot 4 dropped RedisCacheManagerBuilderCustomizer from
    # org.springframework.boot.autoconfigure.cache, so CacheConfig stops
    # compiling: that is a migration, not a bump. springdoc follows the same
    # major track and its 3.x line targets Boot 4, so holding one without the
    # other only moves the break to startup, where nothing here would catch it.
    ignore:
      - dependency-name: org.springframework.boot:spring-boot-starter-parent
        update-types: ['version-update:semver-major']
      - dependency-name: org.springdoc:springdoc-openapi-starter-webmvc-ui
        update-types: ['version-update:semver-major']
      # 7.4.0 pulls Spring Boot 4 modules alongside the Boot 3 ones already
      # here, and two JacksonAutoConfiguration classes cannot both register
      # jsonComponentModule: the context refuses to start. A minor number, so
      # the major rules above do not cover it, and it took the site down once.
      - dependency-name: com.azure.spring:spring-cloud-azure-dependencies
        versions: ['7.4.0']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
      time: '06:00'
      timezone: Europe/Paris
    target-branch: develop
    open-pull-requests-limit: 1
    groups:
      github-actions:
        patterns:
          - '*'
